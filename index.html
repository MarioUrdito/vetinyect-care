<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VetInyect Care">
<style>html,body{margin:0;min-height:100%}[hidden]{display:none!important}img{max-width:100%}body{padding-top:env(safe-area-inset-top)}</style>
<title>VetInyect Care</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0E5A6B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Figtree:wght@500;600;700&display=swap">
<style>
/* Layout: una columna de móvil; cabecera de color, tarjetas por paciente, fichas en bloques plegables */
:root{
  --bg:#F2F6F7; --surface:#FFFFFF; --fg:#15262B; --muted:#4A5D62; --line:#DCE5E7;
  --accent:#0E5A6B; --accent-soft:#E3F1F3; --accent-ink:#08404C; --on-accent:#FFFFFF; --head-sub:#CFE6EA;
  --pend:#B4570B; --pend-soft:#FFE9D1; --pend-ink:#7A4A0C;
  --ok-card:#E2F2EE; --ok-line:#7FBFB1;
  --inf:#8E3B8A; --inf-soft:#F6E8F5; --inf-ink:#6E2A6B;
  --red:#C62828; --red-soft:#FDEAEA; --red-ink:#8E1B1B;
  --green:#2F7D32; --green-soft:#E6F4E7; --green-ink:#1E5B21;
  --morn:#FFF6D6; --morn-line:#D9B53A; --morn-ink:#5C4700; --morn-tag:#8A6A00;
  --night:#E4ECFB; --night-line:#7E9DD6; --night-ink:#1B3A73; --night-tag:#1F4A9B;
  --font-display:"Figtree", "Segoe UI", system-ui, sans-serif;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1719; --surface:#16242A; --fg:#E6EEF0; --muted:#A3B5BA; --line:#2A3C43;
  --accent:#4FB3C4; --accent-soft:#16363D; --accent-ink:#BFE6EC; --on-accent:#06262D; --head-sub:#CDE7EC;
  --pend:#F0A35A; --pend-soft:#3A2814; --pend-ink:#F7C99B;
  --ok-card:#17332E; --ok-line:#3E7D70;
  --inf:#C77CC2; --inf-soft:#33203A; --inf-ink:#EBC4E8;
  --red:#F07070; --red-soft:#3A1C1C; --red-ink:#F7B5B5;
  --green:#6CC070; --green-soft:#183020; --green-ink:#B9E5BB;
  --morn:#352D12; --morn-line:#8F7A2C; --morn-ink:#F1DE9C; --morn-tag:#E2C25A;
  --night:#18243D; --night-line:#4A6AA6; --night-ink:#C5D5F5; --night-tag:#8FB0EE;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1719; --surface:#16242A; --fg:#E6EEF0; --muted:#A3B5BA; --line:#2A3C43;
  --accent:#4FB3C4; --accent-soft:#16363D; --accent-ink:#BFE6EC; --on-accent:#06262D; --head-sub:#CDE7EC;
  --pend:#F0A35A; --pend-soft:#3A2814; --pend-ink:#F7C99B;
  --ok-card:#17332E; --ok-line:#3E7D70;
  --inf:#C77CC2; --inf-soft:#33203A; --inf-ink:#EBC4E8;
  --red:#F07070; --red-soft:#3A1C1C; --red-ink:#F7B5B5;
  --green:#6CC070; --green-soft:#183020; --green-ink:#B9E5BB;
  --morn:#352D12; --morn-line:#8F7A2C; --morn-ink:#F1DE9C; --morn-tag:#E2C25A;
  --night:#18243D; --night-line:#4A6AA6; --night-ink:#C5D5F5; --night-tag:#8FB0EE;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
#app{max-width:560px;margin:0 auto;min-height:100%}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.head{position:relative;background:var(--accent);color:var(--on-accent);padding-block:16px 18px;display:flex;flex-direction:column;gap:12px}
.headlogo{position:absolute;top:9px;right:16px;display:flex;align-items:center;pointer-events:none;opacity:.95;z-index:1}
.headlogo svg{height:50px!important;width:auto!important;max-width:none!important}
.head.home .headlogo svg{height:38px!important}
.head .sub{color:var(--head-sub);font-size:14px}
.head h1{font-size:25px;font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.back{background:none;border:0;color:var(--head-sub);font-size:15px;padding:0;min-height:36px;align-self:flex-start}
.btn{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-weight:700;font-size:15px}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.white{background:var(--surface);color:var(--accent);border-color:transparent;font-size:16px}
.btn.dashed{border-style:dashed;border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn.block{width:100%}
.btn[aria-disabled="true"]{background:var(--bg);color:var(--muted);border-color:var(--line)}
.chip{min-height:42px;border-radius:21px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:14px}
.rgrow:first-child{border-top:0!important}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px}
.seg button{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.seg button.on{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.seg button.on-inf{border:2px solid var(--inf);background:var(--inf);color:#fff;font-weight:700}
.stack{display:flex;flex-direction:column;gap:12px}
.main{padding-block:14px 32px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px;color:var(--fg);width:100%}
.field textarea{padding:10px 12px;min-height:120px;resize:vertical;line-height:1.5}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pcard{display:flex;flex-direction:column;gap:7px;text-align:left;width:100%;border-radius:14px;padding:13px;border:1px solid var(--ok-line);background:var(--ok-card)}
.pmain{background:none;border:0;padding:0;margin:0;text-align:left;color:inherit;font:inherit;width:100%;display:flex;flex-direction:column;gap:7px;cursor:pointer}
.cagebtn{width:48px;height:48px;border:1px solid var(--line);cursor:pointer;flex:none;font-size:15px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.cbox{min-height:64px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;font-size:13px;color:var(--fg)}
.cbox b{font-family:var(--font-display);font-size:17px}
.cbox.occ{background:var(--bg);color:var(--muted)}
.cbox.cur{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.pcard.pend{background:var(--pend-soft);border:2px solid var(--pend)}
.cage{width:42px;height:42px;border-radius:10px;background:var(--surface);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--font-display)}
.pname{font-weight:700;font-size:17px;font-family:var(--font-display)}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.tag.inf{background:var(--inf);color:#fff;font-size:14px}
.tag.noinf{background:var(--surface);color:var(--muted);font-weight:400}
.tag.red{background:var(--red-soft);color:var(--red-ink);border:1px solid var(--red)}
.tag.green{background:var(--green-soft);color:var(--green-ink);border:1px solid var(--green)}
.tag.via{background:var(--accent-soft);color:var(--accent-ink)}
.ema{width:30px;height:30px;border-radius:15px;border:2px solid var(--pend);background:var(--pend-soft);color:var(--pend-ink);display:flex;align-items:center;justify-content:center;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;vertical-align:-1px;margin-right:5px}
.turnbtn{width:100%;min-height:54px;border-radius:10px;padding:0 12px;display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--ok-line);background:var(--ok-card);color:var(--accent-ink)}
.turnbtn.pend{border:2px solid var(--pend);background:var(--pend-soft);color:var(--pend-ink)}
.turnbtn.none{border:1px dashed var(--line);background:var(--surface);color:var(--muted)}
.medrow{display:flex;align-items:center;gap:10px;min-height:54px;padding-left:4px}
.box{width:30px;height:30px;border-radius:8px;border:2px solid var(--pend);background:var(--surface);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none}
.box.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.box.round{border-radius:15px}
.x{width:44px;height:44px;border-radius:10px;border:1px solid var(--red);background:var(--surface);color:var(--red);font-size:20px;font-weight:700;flex:none}
.dose{font-weight:700;white-space:nowrap}
.callrow{border-top:1px dashed var(--line);margin-left:4px;padding-top:8px}
.factbar{width:100%;min-height:52px;border-radius:10px;padding:0 12px;display:flex;align-items:center;gap:10px;border:2px solid var(--red);background:var(--red-soft);color:var(--red-ink);font-size:15px;text-align:left}
.factbar.ok{border-color:var(--green);background:var(--green-soft);color:var(--green-ink)}
.fbox{width:24px;height:24px;border-radius:6px;border:2px solid var(--red);background:var(--surface);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;flex:none}
.factbar.ok .fbox,.fpill.ok .fbox{background:var(--green);border-color:var(--green)}
.fpill{min-height:38px;border-radius:8px;padding:0 9px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--red);background:var(--red-soft);color:var(--red-ink);font-size:12px;font-weight:700}
.fpill .fbox{width:20px;height:20px}
.fpill.ok{border-color:var(--green);background:var(--green-soft);color:var(--green-ink)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px}
.list>*+*{border-top:1px solid var(--line)}
.li{padding:10px 12px}
.anagrid{display:grid;grid-template-columns:minmax(0,1fr) 54px 62px 56px;align-items:center;gap:2px;font-size:14px;min-height:30px}
.anagrid span:not(:first-child){text-align:right}
.hi{color:var(--pend);font-weight:700}
.note{border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.note.m{background:var(--morn);border:1px solid var(--morn-line);color:var(--morn-ink)}
.note.n{background:var(--night);border:1px solid var(--night-line);color:var(--night-ink)}
.note p{margin:0;color:var(--fg);line-height:1.5}
.ttag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;color:#fff}
.m .ttag{background:var(--morn-tag);color:var(--surface)}
.n .ttag{background:var(--night-tag);color:var(--surface)}
.banner{border-radius:12px;padding:12px 14px;font-weight:700;font-size:14px}
.banner.red{background:var(--red-soft);color:var(--red-ink);border:2px solid var(--red)}
.banner.green{background:var(--green-soft);color:var(--green-ink);border:2px solid var(--green)}
.banner.pend{background:var(--pend-soft);color:var(--pend-ink);border:2px solid var(--pend)}
.result{background:var(--accent);color:var(--on-accent);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px}.result>.tiny{flex:none;white-space:nowrap}
.result .big{font-size:30px;font-weight:700;font-family:var(--font-display)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:20}
.demo{font-size:12px;color:var(--muted);text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.err{color:var(--red);font-size:13px}
@media (prefers-reduced-motion:no-preference){.pcard,.turnbtn,.factbar,.fpill{transition:background .2s,border-color .2s}}
</style>
